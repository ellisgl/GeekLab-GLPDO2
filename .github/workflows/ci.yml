name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: glpdo2
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glpdo2
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d glpdo2"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQLHOST: 127.0.0.1
      MYSQLDB: glpdo2
      MYSQLUSER: root
      MYSQLPASS: root
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDB: glpdo2
      PGUSER: postgres
      PGPASS: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_pgsql
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - run: vendor/bin/phpunit

  quality:
    name: PHPStan & PSR-12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: composer phpstan
      - run: composer phpcs
